; Ajustes de PHP para producción
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 110M
max_file_uploads = 20
max_execution_time = 60
expose_php = Off
date.timezone = America/Bogota

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
